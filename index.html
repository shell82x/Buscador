<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Inventario - Accesorios Azteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-3 sm:p-6">
    <div class="max-w-4xl mx-auto bg-white p-4 sm:p-6 rounded-lg shadow-md border-t-4 border-red-600">
        <!-- Logo Header -->
        <div class="flex items-center gap-3 sm:gap-4 mb-4 sm:mb-6 border-b pb-3 sm:pb-4">
            <img src="image.jpg" alt="Accesorios Azteca" class="h-10 sm:h-14 object-contain">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Buscador de Inventario</h1>
                <p class="text-xs sm:text-sm text-gray-500">Sistema de consulta interna</p>
            </div>
        </div>

        <input type="text" id="search" placeholder="Escribe para buscar por código o descripción..." class="w-full p-3 text-sm sm:text-base border rounded-lg mb-3 sm:mb-4 focus:outline-none focus:ring-2 focus:ring-red-500" disabled>
        <p id="status" class="text-xs sm:text-sm text-gray-500 mb-4">Cargando base de datos, por favor espera...</p>
        
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2VRVh1aPoWt4roKv6AyOx3Lu7Rkw4kpftfLEMox8MX2YV_zYRXExQs0QvQJ4rvxfu4w/exec";
        let inventory = [];

        async function init() {
            const status = document.getElementById('status');
            const searchInput = document.getElementById('search');
            
            // Clear broken localStorage cache to prevent quota errors
            try { localStorage.removeItem('inventory_cache'); } catch(e) {}

            try {
                status.innerText = "Descargando inventario...";
                const res = await fetch(WEB_APP_URL);
                inventory = await res.json();
                status.innerText = `Inventario listo (${inventory.length} productos). ¡Ya puedes buscar!`;
                searchInput.disabled = false;
            } catch (err) {
                status.innerText = "Error al conectar con la base de datos.";
                console.error(err);
            }
        }
        init();

        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsDiv = document.getElementById('results');
            const status = document.getElementById('status');
            
            resultsDiv.innerHTML = '';

            if (query.length < 2) {
                status.innerText = `Inventario listo (${inventory.length} productos). Escribe al menos 2 letras.`;
                return;
            }

            const filtered = inventory.filter(item => {
                const desc = item.DESCRIPCION ? String(item.DESCRIPCION).toLowerCase().trim() : '';
                const code = item.CODIGO ? String(item.CODIGO).toLowerCase().trim() : '';
                
                const intCode1 = item['CODIGO INTERNO'] ? String(item['CODIGO INTERNO']).toLowerCase().trim() : '';
                const intCode2 = item['CODIGO_INTERNO'] ? String(item['CODIGO_INTERNO']).toLowerCase().trim() : '';
                
                const queryWords = query.split(/\s+/);
                
                return queryWords.every(word => 
                    desc.includes(word) || code.includes(word) || intCode1.includes(word) || intCode2.includes(word)
                );
            }).slice(0, 20);

            status.innerText = `Resultados encontrados: ${filtered.length}`;

            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<p class="text-gray-500 col-span-2 text-center py-4">No se encontraron productos.</p>';
                return;
            }

            filtered.forEach(item => {
                const internalCodeVal = item['CODIGO_INTERNO'] || item['CODIGO INTERNO'] || 'N/A';
                resultsDiv.innerHTML += `
                    <div class="border p-3 sm:p-4 rounded-lg flex flex-col justify-between bg-gray-50 shadow-sm">
                        <div class="h-40 sm:h-48 bg-gray-200 mb-3 flex items-center justify-center overflow-hidden rounded">
                            ${item.FOTO_URL ? `<img src="${item.FOTO_URL}" class="object-contain h-full w-full">` : '<span class="text-gray-400 text-sm">Sin foto</span>'}
                        </div>
                        <div>
                            <p class="font-bold text-base sm:text-lg text-gray-800">${item.DESCRIPCION || 'Sin descripción'}</p>
                            <div class="flex flex-wrap gap-x-4 gap-y-1 mt-1 text-xs sm:text-sm text-gray-600">
                                <p>Código: <span class="font-semibold text-gray-800">${item.CODIGO || 'N/A'}</span></p>
                                <p>Cód. Interno: <span class="font-semibold text-gray-800">${internalCodeVal}</span></p>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-between items-center border-t pt-2">
                            <span class="text-base sm:text-lg font-bold text-red-600">$${item['PRECIO FINAL'] || '0.00'}</span>
                            <span class="text-xs sm:text-sm bg-gray-200 text-gray-800 px-2 py-1 rounded font-semibold">Stock: ${item['EXISTENCIA REAL'] || '0'}</span>
                        </div>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
