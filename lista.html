<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Lista - Accesorios Azteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-row:hover {
            background-color: #fef2f2;
        }
        #photo-preview {
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        #photo-preview.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-100 p-3 sm:p-6">
    <div class="max-w-6xl mx-auto bg-white p-4 sm:p-6 rounded-lg shadow-md border-t-4 border-red-600 relative">
        <!-- Header -->
        <div class="flex items-center gap-3 sm:gap-4 mb-4 sm:mb-6 border-b pb-3 sm:pb-4">
            <img src="image.jpg" alt="Accesorios Azteca" class="h-10 sm:h-14 object-contain">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Buscador de Inventario</h1>
                <p class="text-xs sm:text-sm text-gray-500">Vista Lista · Pasa el mouse sobre una fila para ver la foto</p>
            </div>
        </div>

        <input type="text" id="search" placeholder="Escribe para buscar por código o descripción..." 
               class="w-full p-3 text-sm sm:text-base border rounded-lg mb-3 sm:mb-4 focus:outline-none focus:ring-2 focus:ring-red-500" disabled>
        <p id="status" class="text-xs sm:text-sm text-gray-500 mb-4">Cargando base de datos, por favor espera...</p>

        <!-- Tabla / Lista -->
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs sticky top-0">
                    <tr>
                        <th class="px-3 py-2 font-semibold">Código</th>
                        <th class="px-3 py-2 font-semibold">Cód. Interno</th>
                        <th class="px-3 py-2 font-semibold">Descripción</th>
                        <th class="px-3 py-2 font-semibold text-right">Precio Final</th>
                        <th class="px-3 py-2 font-semibold text-right">Precio s/IVA</th>
                        <th class="px-3 py-2 font-semibold text-right">STOCK</th>
                        <th class="px-3 py-2 font-semibold text-right">Ingreso</th>
                    </tr>
                </thead>
                <tbody id="results">
                </tbody>
            </table>
        </div>

        <!-- Preview de foto al hover -->
        <div id="photo-preview" class="hidden fixed z-50 bg-white border-2 border-red-500 rounded-lg shadow-2xl p-2 pointer-events-none" style="width: 280px;">
            <img id="preview-img" src="" alt="Foto producto" class="w-full h-64 object-contain rounded">
            <p id="preview-code" class="text-center text-xs text-gray-600 mt-1 font-medium"></p>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbysgQZsOrTj86Hkyl19YxSDUTSh47-3_rzV596DzmRA5xDtvqF64ek26NrSeaCJN1PZjA/exec";
        let inventory = [];

        async function init() {
            const status = document.getElementById('status');
            const searchInput = document.getElementById('search');
            try { localStorage.removeItem('inventory_cache'); } catch(e) {}

            try {
                status.innerText = "Descargando inventario...";
                const res = await fetch(WEB_APP_URL);
                inventory = await res.json();
                status.innerText = `Inventario listo (${inventory.length.toLocaleString()} productos). ¡Ya puedes buscar!`;
                searchInput.disabled = false;
            } catch (err) {
                status.innerText = "Error al conectar con la base de datos.";
                console.error(err);
            }
        }
        init();

        const photoPreview = document.getElementById('photo-preview');
        const previewImg = document.getElementById('preview-img');
        const previewCode = document.getElementById('preview-code');

        function showPhoto(e, fotoUrl, codigoInterno) {
            if (!fotoUrl || fotoUrl === '#N/A' || fotoUrl === '') {
                photoPreview.classList.add('hidden');
                return;
            }
            previewImg.src = fotoUrl;
            previewCode.textContent = codigoInterno ? `Cód. Interno: ${codigoInterno}` : '';
            photoPreview.classList.remove('hidden');

            const x = e.clientX + 20;
            const y = e.clientY - 100;
            photoPreview.style.left = Math.min(x, window.innerWidth - 300) + 'px';
            photoPreview.style.top = Math.max(10, Math.min(y, window.innerHeight - 320)) + 'px';
        }

        function hidePhoto() {
            photoPreview.classList.add('hidden');
            previewImg.src = '';
        }

        function formatFecha(fecha) {
            if (fecha == null || fecha === '') return 'N/A';
            // Si viene como timestamp (número) de Google Sheets
            if (typeof fecha === 'number') {
                const d = new Date(fecha);
                if (!isNaN(d.getTime())) {
                    return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
                }
            }
            // Si viene como string de fecha
            const d = new Date(fecha);
            if (!isNaN(d.getTime())) {
                return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
            }
            // Si no se puede parsear, mostrar el valor original
            return String(fecha);
        }

        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const resultsBody = document.getElementById('results');
            const status = document.getElementById('status');
            resultsBody.innerHTML = '';
            hidePhoto();

            if (query.length < 2) {
                status.innerText = `Inventario listo (${inventory.length.toLocaleString()} productos). Escribe al menos 2 letras.`;
                return;
            }

            const filtered = inventory.filter(item => {
                const desc = item.DESCRIPCION ? String(item.DESCRIPCION).toLowerCase().trim() : '';
                const code = item.CODIGO ? String(item.CODIGO).toLowerCase().trim() : '';
                const intCode1 = item['CODIGO INTERNO'] ? String(item['CODIGO INTERNO']).toLowerCase().trim() : '';
                const intCode2 = item['CODIGO_INTERNO'] ? String(item['CODIGO_INTERNO']).toLowerCase().trim() : '';
                const queryWords = query.split(/\s+/);
                return queryWords.every(word =>
                    desc.includes(word) || code.includes(word) || intCode1.includes(word) || intCode2.includes(word)
                );
            }).slice(0, 50);

            status.innerText = `Resultados encontrados: ${filtered.length}`;

            if (filtered.length === 0) {
                resultsBody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-gray-500">No se encontraron productos.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const internalCode = item['CODIGO_INTERNO'] || item['CODIGO INTERNO'] || '—';
                const foto = item.FOTO_URL || '';
                const precioFinal = item['PRECIO FINAL'] != null && item['PRECIO FINAL'] !== '' ? Number(item['PRECIO FINAL']).toFixed(2) : '0.00';
                const precioSinIva = item['PRECIO SIN IVA'] != null && item['PRECIO SIN IVA'] !== '' ? Number(item['PRECIO SIN IVA']).toFixed(2) : '0.00';
                const stock = (item['EXISTENCIA REAL'] != null && item['EXISTENCIA REAL'] !== '') ? item['EXISTENCIA REAL'] : 'N/A';
                const fechaIngreso = formatFecha(item['FECHA DE INGRESO']);

                const tr = document.createElement('tr');
                tr.className = 'product-row border-b border-gray-100 cursor-pointer transition-colors';
                tr.innerHTML = `
                    <td class="px-3 py-2.5 font-medium text-gray-800 whitespace-nowrap">${item.CODIGO || '—'}</td>
                    <td class="px-3 py-2.5 text-gray-700 whitespace-nowrap">${internalCode}</td>
                    <td class="px-3 py-2.5 text-gray-800">${item.DESCRIPCION || 'Sin descripción'}</td>
                    <td class="px-3 py-2.5 text-right font-bold text-red-600 whitespace-nowrap">$${precioFinal}</td>
                    <td class="px-3 py-2.5 text-right text-gray-600 whitespace-nowrap">$${precioSinIva}</td>
                    <td class="px-3 py-2.5 text-right whitespace-nowrap">
                        <span class="inline-block bg-gray-200 text-gray-800 px-2 py-0.5 rounded text-xs font-semibold">STOCK: ${stock}</span>
                    </td>
                    <td class="px-3 py-2.5 text-right text-gray-600 whitespace-nowrap text-xs">${fechaIngreso}</td>
                `;

                tr.addEventListener('mousemove', (ev) => showPhoto(ev, foto, internalCode));
                tr.addEventListener('mouseleave', hidePhoto);
                resultsBody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
