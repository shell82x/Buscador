<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Buscador Lista - Accesorios Azteca</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #login.hidden, #panel.hidden { display: none; }
        body.modo-invitado .col-dueno { display: none; }
        .product-row:hover,
        .product-row.activa {
            background-color: #fef2f2;
        }
        #photo-preview {
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        #photo-preview.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-gray-100 p-3 sm:p-6">

    <!-- ================= Pantalla de entrada ================= -->
    <div id="login" class="hidden max-w-sm mx-auto mt-10 sm:mt-20 bg-white p-6 rounded-lg shadow-md border-t-4 border-red-600">
        <div class="flex flex-col items-center mb-6">
            <img src="image.jpg" alt="Accesorios Azteca" class="h-14 object-contain mb-3">
            <h1 class="text-xl font-bold text-gray-800">Lista de Inventario</h1>
            <p class="text-xs text-gray-500">Accesorios Azteca</p>
        </div>

        <button id="invitado-boton" type="button"
                class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition-colors">Consultar lista</button>

        <div class="flex items-center gap-3 my-5">
            <div class="flex-1 border-t"></div>
            <span class="text-xs text-gray-400 uppercase">Acceso</span>
            <div class="flex-1 border-t"></div>
        </div>

        <form id="login-form" autocomplete="on">
            <label for="login-usuario" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
            <input id="login-usuario" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required
                   class="w-full p-3 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-red-500">
            <label for="login-clave" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input id="login-clave" name="password" type="password" autocomplete="current-password" required
                   class="w-full p-3 border rounded-lg mb-2 focus:outline-none focus:ring-2 focus:ring-red-500">
            <p id="login-error" class="text-sm text-red-600 min-h-[1.5rem] mb-2" role="alert"></p>
            <button id="login-boton" type="submit"
                    class="w-full border border-gray-300 hover:bg-gray-50 disabled:opacity-60 text-gray-800 font-semibold py-3 rounded-lg transition-colors">Acceso estratégico</button>
        </form>
    </div>

    <!-- ================= Lista ================= -->
    <div id="panel" class="hidden max-w-7xl mx-auto bg-white p-4 sm:p-6 rounded-lg shadow-md border-t-4 border-red-600 relative">
        <div class="flex flex-wrap items-center gap-3 sm:gap-4 mb-4 sm:mb-6 border-b pb-3 sm:pb-4">
            <img src="image.jpg" alt="Accesorios Azteca" class="h-10 sm:h-14 object-contain">
            <div class="flex-1 min-w-0">
                <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Lista de Inventario</h1>
                <p id="panel-subtitulo" class="text-xs sm:text-sm text-gray-500"></p>
            </div>
            <!-- Solo visible con Acceso estratégico -->
            <button id="excel-boton" type="button" disabled
                    class="col-dueno shrink-0 inline-flex items-center gap-2 bg-green-700 hover:bg-green-800 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
                </svg>
                <span id="excel-texto">Descargar Excel</span>
            </button>
            <div class="text-right shrink-0">
                <p id="sesion-etiqueta" class="text-xs text-gray-500"></p>
                <p id="usuario-nombre" class="text-sm font-semibold text-gray-800"></p>
                <button id="salir" class="text-xs text-red-600 hover:underline mt-1"></button>
            </div>
        </div>

        <input type="text" id="search"
               class="w-full p-3 text-sm sm:text-base border rounded-lg mb-3 sm:mb-4 focus:outline-none focus:ring-2 focus:ring-red-500" disabled>
        <p id="status" class="text-xs sm:text-sm text-gray-500 mb-4"></p>

        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 text-gray-600 uppercase text-xs sticky top-0">
                    <tr>
                        <th class="px-3 py-2 font-semibold">Código</th>
                        <th class="px-3 py-2 font-semibold">Cód. Interno</th>
                        <th class="px-3 py-2 font-semibold">Descripción</th>
                        <th class="px-3 py-2 font-semibold col-dueno">Proveedor</th>
                        <th class="px-3 py-2 font-semibold text-right col-dueno">Costo</th>
                        <th class="px-3 py-2 font-semibold text-right">Precio Final</th>
                        <th class="px-3 py-2 font-semibold text-right">Precio s/IVA</th>
                        <th class="px-3 py-2 font-semibold text-right">Stock</th>
                        <th class="px-3 py-2 font-semibold text-right">Ingreso</th>
                    </tr>
                </thead>
                <tbody id="results"></tbody>
            </table>
        </div>

        <div id="photo-preview" class="hidden fixed z-50 bg-white border-2 border-red-500 rounded-lg shadow-2xl p-2 pointer-events-none" style="width: 280px;">
            <img id="preview-img" alt="Foto producto" class="w-full h-64 object-contain rounded">
            <p id="preview-code" class="text-center text-xs text-gray-600 mt-1 font-medium"></p>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz2VRVh1aPoWt4roKv6AyOx3Lu7Rkw4kpftfLEMox8MX2YV_zYRXExQs0QvQJ4rvxfu4w/exec";
        const MAX_RESULTADOS = 50;
        const LLAVE_SESION = 'azteca_sesion';

        // Los datos solo viven en memoria: al cerrar la pestaña o salir desaparecen
        let inventory = [];
        let modo = null;    // 'dueno' | 'invitado' | null
        let cargaId = 0;    // evita que una descarga vieja pise a la actual al cambiar de modo

        const $ = id => document.getElementById(id);
        const statusEl = $('status');
        const searchInput = $('search');
        const resultsBody = $('results');
        const photoPreview = $('photo-preview');
        const previewImg = $('preview-img');
        const previewCode = $('preview-code');

        const esDueno = () => modo === 'dueno';

        // ---------- Utilidades ----------
        function normalizar(texto) {
            return String(texto || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
        }
        function esc(texto) {
            return String(texto).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function codigoInterno(item) {
            return item['CODIGO_INTERNO'] || item['CODIGO INTERNO'] || '';
        }
        function formatFecha(fecha) {
            if (fecha == null || fecha === '') return 'N/A';
            const d = new Date(fecha);
            return isNaN(d.getTime()) ? String(fecha) : d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }
        function dinero(valor) {
            const n = Number(valor);
            return (valor != null && valor !== '' && !isNaN(n)) ? n.toFixed(2) : '0.00';
        }
        function prepararInventario(datos) {
            datos.forEach(item => {
                const campos = [item.DESCRIPCION, item.CODIGO, codigoInterno(item)];
                if (esDueno()) campos.push(item.PROVEEDOR);
                item._busca = normalizar(campos.join(' '));
            });
            return datos;
        }
        function mensajeListo(extra) {
            statusEl.innerText = `Inventario listo (${inventory.length.toLocaleString('es-MX')} productos). ${extra}`;
        }

        // ---------- Comunicación con Apps Script ----------
        async function api(cuerpo) {
            const res = await fetch(WEB_APP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita bloqueo CORS
                body: JSON.stringify(cuerpo)
            });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        }

        // Se recuerda el modo hasta cerrar la pestaña (la sesión de dueño vence en el servidor a las 6 h)
        function leerSesion() { try { return JSON.parse(sessionStorage.getItem(LLAVE_SESION)); } catch (e) { return null; } }
        function guardarSesion(s) { try { sessionStorage.setItem(LLAVE_SESION, JSON.stringify(s)); } catch (e) {} }
        function borrarSesion() { try { sessionStorage.removeItem(LLAVE_SESION); } catch (e) {} }

        // ---------- Pantallas ----------
        function limpiarDatos() {
            cargaId++;
            inventory = [];
            resultsBody.innerHTML = '';
            searchInput.value = '';
            hidePhoto();
        }

        function mostrarLogin(mensaje) {
            limpiarDatos();
            modo = null;
            document.body.classList.remove('modo-invitado');
            $('panel').classList.add('hidden');
            $('login').classList.remove('hidden');
            $('login-error').textContent = mensaje || '';
            $('login-clave').value = '';
        }

        function mostrarPanel(nuevoModo, nombre) {
            limpiarDatos();
            modo = nuevoModo;
            document.body.classList.toggle('modo-invitado', !esDueno());
            $('login').classList.add('hidden');
            $('panel').classList.remove('hidden');
            $('panel-subtitulo').textContent = esDueno()
                ? 'Vista dirección · Pasa el mouse (o toca en el celular) una fila para ver la foto'
                : 'Consulta general · Pasa el mouse (o toca en el celular) una fila para ver la foto';
            $('sesion-etiqueta').textContent = esDueno() ? 'Sesión de' : 'Modo';
            $('usuario-nombre').textContent = esDueno() ? (nombre || '') : 'Consulta general';
            $('salir').textContent = esDueno() ? 'Cerrar sesión' : 'Acceso';
            searchInput.placeholder = esDueno()
                ? 'Busca por código, descripción o proveedor...'
                : 'Busca por código o descripción...';
            searchInput.disabled = true;
            $('excel-boton').disabled = true;
            statusEl.innerText = 'Descargando inventario, puede tardar un poco...';
            return cargaId;
        }

        function datosListos(datos) {
            inventory = prepararInventario(datos);
            searchInput.disabled = false;
            $('excel-boton').disabled = !esDueno();
            searchInput.focus();
            mensajeListo('¡Ya puedes buscar!');
        }

        // Dueños: datos completos (con costo y proveedor) desde doPost, con token
        async function cargarDueno(sesion) {
            const id = mostrarPanel('dueno', sesion.nombre);
            try {
                const r = await api({ accion: 'datos', token: sesion.token });
                if (id !== cargaId) return;
                if (!r.ok) {
                    borrarSesion();
                    mostrarLogin(r.error === 'sesion' ? 'Tu sesión expiró. Vuelve a entrar.' : (r.error || 'No se pudo cargar el inventario.'));
                    return;
                }
                datosListos(r.datos);
            } catch (err) {
                if (id !== cargaId) return;
                console.error(err);
                statusEl.innerText = 'Error al conectar con la base de datos. Recarga la página para intentar de nuevo.';
            }
        }

        // Invitados: datos públicos (sin costo ni proveedor) desde doGet, igual que index.html
        async function cargarInvitado() {
            guardarSesion({ modo: 'invitado' });
            const id = mostrarPanel('invitado');
            try {
                const res = await fetch(WEB_APP_URL);
                const datos = await res.json();
                if (id !== cargaId) return;
                if (!Array.isArray(datos)) throw new Error('Respuesta inesperada del servidor');
                datosListos(datos);
            } catch (err) {
                if (id !== cargaId) return;
                console.error(err);
                statusEl.innerText = 'Error al conectar con la base de datos. Recarga la página para intentar de nuevo.';
            }
        }

        $('invitado-boton').addEventListener('click', cargarInvitado);

        $('login-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const usuario = $('login-usuario').value.trim();
            const clave = $('login-clave').value;
            if (!usuario || !clave) return;

            const boton = $('login-boton');
            boton.disabled = true;
            boton.textContent = 'Verificando...';
            $('login-error').textContent = '';
            try {
                const r = await api({ accion: 'login', usuario, clave });
                if (r.ok) {
                    const sesion = { modo: 'dueno', token: r.token, nombre: r.nombre };
                    guardarSesion(sesion);
                    $('login-clave').value = '';
                    cargarDueno(sesion);
                } else {
                    $('login-error').textContent = r.error || 'Usuario o contraseña incorrectos.';
                    $('login-clave').value = '';
                    $('login-clave').focus();
                }
            } catch (err) {
                console.error(err);
                $('login-error').textContent = 'No se pudo conectar. Revisa tu internet.';
            } finally {
                boton.disabled = false;
                boton.textContent = 'Acceso estratégico';
            }
        });

        $('salir').addEventListener('click', () => {
            const s = leerSesion();
            const eraDueno = esDueno();
            borrarSesion();
            if (eraDueno && s && s.token) api({ accion: 'logout', token: s.token }).catch(() => {});
            mostrarLogin(eraDueno ? 'Sesión cerrada.' : '');
            if (!eraDueno) $('login-usuario').focus();
        });

        // ---------- Vista previa de foto ----------
        let filaActiva = null;

        function showPhoto(x, y, fotoUrl, interno) {
            if (!fotoUrl || fotoUrl === '#N/A') { hidePhoto(); return; }
            if (previewImg.getAttribute('src') !== fotoUrl) previewImg.src = fotoUrl;
            previewCode.textContent = interno ? `Cód. Interno: ${interno}` : '';
            photoPreview.classList.remove('hidden');
            const ancho = Math.min(280, window.innerWidth - 20);
            photoPreview.style.width = ancho + 'px';
            photoPreview.style.left = Math.max(10, Math.min(x + 20, window.innerWidth - ancho - 10)) + 'px';
            photoPreview.style.top = Math.max(10, Math.min(y - 100, window.innerHeight - 320)) + 'px';
        }

        function hidePhoto() {
            photoPreview.classList.add('hidden');
            previewImg.removeAttribute('src');
            if (filaActiva) filaActiva.classList.remove('activa');
            filaActiva = null;
        }

        resultsBody.addEventListener('mousemove', (ev) => {
            const tr = ev.target.closest('tr.product-row');
            if (tr) showPhoto(ev.clientX, ev.clientY, tr.dataset.foto, tr.dataset.interno);
        });
        resultsBody.addEventListener('mouseleave', hidePhoto);
        resultsBody.addEventListener('click', (ev) => {
            const tr = ev.target.closest('tr.product-row');
            if (!tr) return;
            if (filaActiva === tr && !photoPreview.classList.contains('hidden')) { hidePhoto(); return; }
            hidePhoto();
            filaActiva = tr;
            tr.classList.add('activa');
            showPhoto(ev.clientX, ev.clientY, tr.dataset.foto, tr.dataset.interno);
        });
        window.addEventListener('scroll', hidePhoto, { passive: true });

        // ---------- Búsqueda ----------
        function buscar() {
            const query = normalizar(searchInput.value);
            hidePhoto();

            if (query.length < 2) {
                resultsBody.innerHTML = '';
                mensajeListo('Escribe al menos 2 letras.');
                return;
            }

            const palabras = query.split(/\s+/);
            const encontrados = [];
            for (let i = 0; i < inventory.length && encontrados.length < MAX_RESULTADOS; i++) {
                if (palabras.every(p => inventory[i]._busca.includes(p))) encontrados.push(inventory[i]);
            }

            statusEl.innerText = `Resultados encontrados: ${encontrados.length}${encontrados.length === MAX_RESULTADOS ? ' (se muestran los primeros 50; escribe más para afinar)' : ''}`;

            const dueno = esDueno();
            if (encontrados.length === 0) {
                resultsBody.innerHTML = `<tr><td colspan="${dueno ? 9 : 7}" class="text-center py-8 text-gray-500">No se encontraron productos.</td></tr>`;
                return;
            }

            resultsBody.innerHTML = encontrados.map(item => {
                const interno = codigoInterno(item) || '—';
                const stock = (item['EXISTENCIA REAL'] != null && item['EXISTENCIA REAL'] !== '') ? item['EXISTENCIA REAL'] : 'N/A';
                const celdasDueno = dueno ? `
                        <td class="px-3 py-2.5 text-gray-700 col-dueno">${esc(item.PROVEEDOR || '—')}</td>
                        <td class="px-3 py-2.5 text-right font-semibold text-amber-700 whitespace-nowrap col-dueno">$${dinero(item.COSTO)}</td>` : '';
                return `
                    <tr class="product-row border-b border-gray-100 cursor-pointer transition-colors"
                        data-foto="${esc(item.FOTO_URL || '')}" data-interno="${esc(interno)}">
                        <td class="px-3 py-2.5 font-medium text-gray-800 whitespace-nowrap">${esc(item.CODIGO || '—')}</td>
                        <td class="px-3 py-2.5 text-gray-700 whitespace-nowrap">${esc(interno)}</td>
                        <td class="px-3 py-2.5 text-gray-800">${esc(item.DESCRIPCION || 'Sin descripción')}</td>${celdasDueno}
                        <td class="px-3 py-2.5 text-right font-bold text-red-600 whitespace-nowrap">$${dinero(item['PRECIO FINAL'])}</td>
                        <td class="px-3 py-2.5 text-right text-gray-600 whitespace-nowrap">$${dinero(item['PRECIO SIN IVA'])}</td>
                        <td class="px-3 py-2.5 text-right whitespace-nowrap font-semibold text-gray-800">${esc(stock)}</td>
                        <td class="px-3 py-2.5 text-right text-gray-600 whitespace-nowrap text-xs">${esc(formatFecha(item['FECHA DE INGRESO']))}</td>
                    </tr>`;
            }).join('');
        }

        searchInput.addEventListener('input', buscar);

        // ---------- Descarga de lista de precios en Excel (solo Acceso estratégico) ----------
        const EXCELJS_URL = 'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js';
        const SITIO_TEXTO = 'www.accesoriosazteca.com';
        const SITIO_URL = 'https://www.accesoriosazteca.com';

        const JSZIP_URL = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';

        // Las librerías solo se descargan la primera vez que alguien presiona el botón
        function cargarScript(url, global) {
            if (window[global]) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = url;
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('No se pudo cargar la librería de Excel. Revisa tu internet.'));
                document.head.appendChild(s);
            });
        }
        const cargarExcelJS = () => cargarScript(EXCELJS_URL, 'ExcelJS');

        // Posición del logo dentro de la celda A1 (columna de 21 caracteres, fila de 52 puntos), en píxeles
        function anclaLogo(proporcion) {
            const celdaAncho = 21 * 7 + 5;        // 152 px
            const celdaAlto = 52 * 96 / 72;       // 69.3 px
            const ancho = 140;
            const alto = Math.round(ancho * proporcion);
            return { celdaAncho, celdaAlto, ancho, alto, x: (celdaAncho - ancho) / 2, y: (celdaAlto - alto) / 2 };
        }

        // ExcelJS guarda la imagen con un anclaje que Excel corrige o descarta y con tamaño interno en cero,
        // por lo que en Excel, celulares y vistas previas el logo puede no aparecer.
        // Aquí se reescribe el anclaje del logo exactamente como lo guarda Excel al insertar una imagen.
        async function repararImagenes(buffer, ancla) {
            try {
                await cargarScript(JSZIP_URL, 'JSZip');
                const zip = await JSZip.loadAsync(buffer);
                const EMU = 9525;  // unidades de Excel por píxel
                const x1 = Math.round(ancla.x * EMU), y1 = Math.round(ancla.y * EMU);
                const x2 = Math.round((ancla.x + ancla.ancho) * EMU), y2 = Math.round((ancla.y + ancla.alto) * EMU);
                const dibujos = Object.keys(zip.files).filter(n => /^xl\/drawings\/drawing\d+\.xml$/.test(n));
                for (const nombre of dibujos) {
                    let xml = await zip.file(nombre).async('string');
                    xml = xml.replace(/<xdr:(oneCellAnchor|twoCellAnchor)\b[^>]*>[\s\S]*?<\/xdr:\1>/, original => {
                        const pic = original.match(/<xdr:pic>[\s\S]*?<\/xdr:pic>/);
                        if (!pic) return original;
                        const picFijo = pic[0].replace(/<a:xfrm>[\s\S]*?<\/a:xfrm>/,
                            `<a:xfrm><a:off x="${x1}" y="${y1}"/><a:ext cx="${x2 - x1}" cy="${y2 - y1}"/></a:xfrm>`);
                        return '<xdr:twoCellAnchor editAs="oneCell">' +
                            `<xdr:from><xdr:col>0</xdr:col><xdr:colOff>${x1}</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>${y1}</xdr:rowOff></xdr:from>` +
                            `<xdr:to><xdr:col>0</xdr:col><xdr:colOff>${x2}</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>${y2}</xdr:rowOff></xdr:to>` +
                            picFijo + '<xdr:clientData/></xdr:twoCellAnchor>';
                    });
                    zip.file(nombre, xml);
                }
                return await zip.generateAsync({ type: 'arraybuffer', compression: 'DEFLATE', compressionOptions: { level: 6 } });
            } catch (err) {
                console.warn('No se pudo ajustar la imagen; se entrega el archivo sin ese ajuste.', err);
                return buffer;
            }
        }

        function numeroOVacio(valor) {
            if (valor == null || valor === '') return null;
            const n = Number(valor);
            return isNaN(n) ? null : Math.round(n * 100) / 100;   // a centavos, como se ve en pantalla
        }

        // Solo productos con código interno, ordenados de forma natural: 001-001, 001-002 … N1 … N4500
        function productosParaExcel() {
            return inventory
                .map(item => ({
                    codigo: String(item.CODIGO == null ? '' : item.CODIGO).replace(/\s+/g, ' ').trim(),
                    interno: String(codigoInterno(item)).replace(/\s+/g, ' ').trim(),
                    descripcion: String(item.DESCRIPCION || '').replace(/\s+/g, ' ').trim(),
                    precio: numeroOVacio(item['PRECIO FINAL']),
                    sinIva: numeroOVacio(item['PRECIO SIN IVA'])
                }))
                .filter(p => p.interno !== '' && p.interno !== '#N/A')
                .sort((a, b) => a.interno.localeCompare(b.interno, 'es', { numeric: true, sensitivity: 'base' }));
        }

        async function cargarLogo() {
            const res = await fetch('image.jpg');
            if (!res.ok) throw new Error('No se encontró el logotipo (image.jpg).');
            const buffer = await res.arrayBuffer();
            const blobUrl = URL.createObjectURL(new Blob([buffer]));
            const medidas = await new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve({ ancho: img.naturalWidth, alto: img.naturalHeight });
                img.onerror = () => resolve({ ancho: 1600, alto: 640 });
                img.src = blobUrl;
            });
            URL.revokeObjectURL(blobUrl);
            return { buffer, proporcion: medidas.alto / medidas.ancho };
        }

        // Catálogo en una sola pestaña, con el formato del CATALOGO de la empresa
        function construirCatalogo(wb, logoId, proporcion, fechaTexto, productos) {
            const FILA_TITULOS = 3;
            const ROJO = 'FFFF0000';
            const BORDE = { style: 'thin', color: { argb: 'FF7F7F7F' } };
            const BORDES = { top: BORDE, left: BORDE, bottom: BORDE, right: BORDE };
            const CONTABLE = '_-"$"* #,##0.00_-;-"$"* #,##0.00_-;_-"$"* "-"??_-;_-@_-';

            const hoja = wb.addWorksheet('CATALOGO', {
                views: [{ state: 'frozen', xSplit: 0, ySplit: FILA_TITULOS, topLeftCell: 'A' + (FILA_TITULOS + 1), activeCell: 'A' + (FILA_TITULOS + 1), showGridLines: false }],
                pageSetup: {
                    paperSize: 1, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
                    horizontalCentered: true, printTitlesRow: FILA_TITULOS + ':' + FILA_TITULOS,
                    margins: { left: 0.35, right: 0.35, top: 0.45, bottom: 0.6, header: 0.2, footer: 0.3 }
                },
                headerFooter: {
                    oddFooter: '&L&8Accesorios Azteca · ' + SITIO_TEXTO + '&C&8Actualizada al ' + fechaTexto + '&R&8Página &P de &N'
                }
            });
            hoja.columns = [{ width: 21 }, { width: 12 }, { width: 72 }, { width: 14 }, { width: 14 }];

            // Fila 1: logotipo + página web en grande
            hoja.getRow(1).height = 52;
            const ancla = anclaLogo(proporcion);
            hoja.addImage(logoId, {
                tl: { col: ancla.x / ancla.celdaAncho, row: ancla.y / ancla.celdaAlto },
                ext: { width: ancla.ancho, height: ancla.alto }
            });
            hoja.mergeCells(1, 2, 1, 5);
            const web = hoja.getCell(1, 2);
            web.value = { text: SITIO_TEXTO, hyperlink: SITIO_URL, tooltip: 'Visitar ' + SITIO_TEXTO };
            web.font = { name: 'Arial', size: 26, color: { argb: 'FF000000' } };
            web.alignment = { horizontal: 'center', vertical: 'middle' };

            // Fila 2: fecha de actualización y total de productos
            hoja.getRow(2).height = 18;
            hoja.mergeCells(2, 1, 2, 5);
            const fecha = hoja.getCell(2, 1);
            fecha.value = 'LISTA DE PRECIOS  ·  Actualizada al ' + fechaTexto + '  ·  ' + productos.length.toLocaleString('es-MX') + ' productos';
            fecha.font = { name: 'Arial', size: 10, bold: true, color: { argb: 'FF404040' } };
            fecha.alignment = { horizontal: 'center', vertical: 'middle' };

            // Fila 3: títulos de columna (fijos al desplazarse y repetidos en cada hoja impresa)
            const titulos = hoja.getRow(FILA_TITULOS);
            titulos.values = ['CÓDIGO DE PRODUCTO', 'CÓDIGO', 'DESCRIPCIÓN', 'PRECIO', 'PRECIO - IVA'];
            titulos.height = 20;
            titulos.eachCell(celda => {
                celda.font = { name: 'Calibri', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
                celda.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: ROJO } };
                celda.alignment = { horizontal: 'center', vertical: 'middle' };
                celda.border = BORDES;
            });

            // Productos
            const zebra = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF5F5F5' } };
            const texto = { name: 'Arial', size: 10 };
            const precio = { name: 'Calibri', size: 11, bold: true };
            productos.forEach((p, i) => {
                const fila = hoja.getRow(FILA_TITULOS + 1 + i);
                fila.values = [p.codigo, p.interno, p.descripcion, p.precio, p.sinIva];
                for (let c = 1; c <= 5; c++) {
                    const celda = fila.getCell(c);
                    celda.border = BORDES;
                    celda.font = c >= 4 ? precio : texto;
                    if (c >= 4) celda.numFmt = CONTABLE;
                    if (c <= 2) celda.alignment = { horizontal: 'center' };
                    if (i % 2 === 1) celda.fill = zebra;
                }
            });

            if (productos.length) {
                hoja.autoFilter = { from: { row: FILA_TITULOS, column: 1 }, to: { row: FILA_TITULOS + productos.length, column: 5 } };
            }
        }

        async function descargarExcel() {
            if (!esDueno() || !inventory.length) return;
            const boton = $('excel-boton');
            const texto = $('excel-texto');
            boton.disabled = true;
            texto.textContent = 'Generando...';
            try {
                const productos = productosParaExcel();
                if (!productos.length) throw new Error('No hay productos con código interno para exportar.');

                await cargarExcelJS();
                const logo = await cargarLogo();
                const hoy = new Date();
                const fechaTexto = hoy.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });

                const wb = new ExcelJS.Workbook();
                wb.creator = 'Accesorios Azteca';
                wb.created = hoy;
                const logoId = wb.addImage({ buffer: logo.buffer, extension: 'jpeg' });

                construirCatalogo(wb, logoId, logo.proporcion, fechaTexto, productos);

                const datos = await repararImagenes(await wb.xlsx.writeBuffer(), anclaLogo(logo.proporcion));
                const blob = new Blob([datos], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const enlace = document.createElement('a');
                const fechaArchivo = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');
                enlace.href = URL.createObjectURL(blob);
                enlace.download = `CATALOGO Accesorios Azteca ${fechaArchivo}.xlsx`;
                document.body.appendChild(enlace);
                enlace.click();
                setTimeout(() => { URL.revokeObjectURL(enlace.href); enlace.remove(); }, 2000);
                statusEl.innerText = `Excel descargado: ${productos.length.toLocaleString('es-MX')} productos con código interno.`;
            } catch (err) {
                console.error(err);
                statusEl.innerText = 'No se pudo generar el Excel: ' + err.message;
            } finally {
                texto.textContent = 'Descargar Excel';
                boton.disabled = !esDueno() || !inventory.length;
            }
        }

        $('excel-boton').addEventListener('click', descargarExcel);

        // ---------- Inicio ----------
        const sesionGuardada = leerSesion();
        if (sesionGuardada && sesionGuardada.modo === 'invitado') cargarInvitado();
        else if (sesionGuardada && sesionGuardada.token) cargarDueno(sesionGuardada);
        else mostrarLogin('');
    </script>
